[package]
name = "courier"
description = "A extendable server software, written in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
doc = false

[features]
default = []
# AUTOGEN FEAT: START #
# --- Generated by build/generator.py - DO NOT EDIT--- #
echo = ["builtin/echo", "waybill/echo"]
http = ["builtin/http", "waybill/http"]
# AUTOGEN FEAT: END #

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

# courier_core
depot = { path = "../courier_core/depot" }
logger = { path = "../courier_core/logger" }
network = { path = "../courier_core/network" }
relay = { path = "../courier_core/relay" }
protocol = { path = "../courier_core/protocol" }

# waybill
waybill = { path = "../waybill" }

# builtin
builtin = { path = "../builtin" }
