[workspace]
members = ["builtin", "courier_core/*", "macros/*", "waybill"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["Courier Team"]

[workspace.metadata.carrier]
kind = "courier"

[workspace.dependencies]
tokio = "1.52.1"
tokio-util = "0.7.19"
tokio-mpmc = "0.2.4"
thiserror = "2.0.18"
crossbeam-channel = "0.5.15"
anyhow = "1.0.104"
bytes = "1.11.1"
chrono = "0.4.45"

marquage = { git = "https://github.com/Hidimen/marquage.git" }

syn = "3.0.3"
proc-macro2 = "1.0.107"
quote = "1.0.47"
