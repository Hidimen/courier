[workspace]
members = ["builtin",
  "courier",
  "courier_core/*",
  "waybill",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"

[workspace.dependencies]
tokio = "1.52.1"
thiserror = "2.0.18"
crossbeam-channel = "0.5.15"

syn = "3.0.3"
proc-macro2 = "1.0.107"
quote = "1.0.47"
