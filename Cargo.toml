[workspace]
members = ["builtin", "courier", "courier_core/*", "macros/*", "waybill"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[workspace.metadata.carrier]
kind = "courier"

[workspace.dependencies]
tokio = "1.52.1"
thiserror = "2.0.18"
crossbeam-channel = "0.5.15"
anyhow = "1.0.104"

marquage = { git = "https://github.com/Hidimen/marquage.git", branch = "feat/1.0.0" }

syn = "3.0.3"
proc-macro2 = "1.0.107"
quote = "1.0.47"
